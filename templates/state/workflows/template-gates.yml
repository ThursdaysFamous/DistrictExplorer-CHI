name: Gates

# The new-state fork's CI, on every PR and push to main. The FIRST gate is the
# placeholder check: a repo freshly created from the template deliberately
# fails here — with instructions — until scripts/bootstrap_state.py has been
# run, so an unbootstrapped fork can never look green. After bootstrap this
# job runs the same battery every fleet fork runs: the static merge gate, the
# generated-region drift gate, and the behaviour gate (real Chromium boot).
#
# The template repository ITSELF skips the placeholder gate (and the gates
# that need bootstrap-built data) so the template stays green while
# deliberately full of placeholders. The signal is GitHub's own "Template
# repository" bit (Settings → General), queried live — the same bit the
# operator flips to enable "Use this template", so it needs no extra config
# and cannot drift: a repo created FROM the template has the bit off.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.56.1"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder gate (fails until bootstrap_state.py has run)
        id: placeholders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .is_template)" = "true" ]; then
            echo "template=true" >> "$GITHUB_OUTPUT"
            echo "::notice::this IS the template repository — placeholder + data gates skipped by design"
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
            python3 scripts/check_template_placeholders.py
          fi

      - name: Static merge gate
        if: steps.placeholders.outputs.template != 'true'
        run: |
          pip install -c scripts/requirements.txt jsonschema
          python3 scripts/generate_metro_files.py --check
          python3 scripts/validate_index.py index.html

      - uses: actions/setup-node@v4
        if: steps.placeholders.outputs.template != 'true'
        with:
          node-version: "20"

      - name: Cache Playwright Chromium
        if: steps.placeholders.outputs.template != 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        if: steps.placeholders.outputs.template != 'true'
        timeout-minutes: 15
        run: |
          retry() {
            local attempts=$1 budget=$2; shift 2
            for i in $(seq 1 "$attempts"); do
              timeout "$budget" "$@" && return 0
              echo "::warning::attempt $i/$attempts of '$*' hung or failed"
              sleep 5
            done
            echo "::error::'$*' failed $attempts time(s) at ${budget}s each"
            return 1
          }
          retry 3 60 npm install "playwright@${PLAYWRIGHT_VERSION}"
          retry 1 420 npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            retry 2 300 npx playwright install chromium
          fi

      - name: Behaviour gate (serve + smoke test)
        if: steps.placeholders.outputs.template != 'true'
        env:
          BASE_URL: http://localhost:8000/
        run: |
          python3 -m http.server 8000 &
          server_pid=$!
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 0.5
          done
          node scripts/smoke_test.mjs
          status=$?
          kill "$server_pid" 2>/dev/null || true
          exit $status
