<title>What district am I in? Find your district — {{BRAND_NAME}}</title>
<meta name="description" content="Enter an address or ZIP — or tap the map — to find your districts: county, municipality, township, school district, U.S. House district, and who represents you. Free, no login." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{CANONICAL_URL}}" />

<!-- Open Graph / social share previews. og-image.png is NOT shipped by the
     template — add your fork's own social-card art (1200x630) at the repo
     root, or delete the og:image/twitter:image lines. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{BRAND_NAME}}" />
<meta property="og:title" content="What district am I in? — {{BRAND_NAME}}" />
<meta property="og:description" content="Click the map or search any {{STATE_NAME}} address to see every civic district that covers it — and who represents you." />
<meta property="og:url" content="{{CANONICAL_URL}}" />
<meta property="og:image" content="{{CANONICAL_URL}}og-image.png" />
<meta property="og:locale" content="en_US" />

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="What district am I in? — {{BRAND_NAME}}" />
<meta name="twitter:description" content="See every civic district that covers a {{STATE_NAME}} address — and who represents you." />
<meta name="twitter:image" content="{{CANONICAL_URL}}og-image.png" />
