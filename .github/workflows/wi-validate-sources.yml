name: Validate layer sources (WI)

# Monthly freshness check for the data sources wi/index.html depends on.
# Unlike the roster workflows (which re-scrape the same page), this catches the
# other failure mode: a publisher silently superseding a dataset — for this
# instance the sharpest case is LTSB's supervisory-district layer, which is
# REPUBLISHED into the same "Current" URL after every 15 January / 15 July
# county filing window (Wis. Stat. 5.15(4)(br)1), so the shipped pre-built
# file goes stale with no error the moment a filing lands.
#
# wi/scripts/validate_sources.py never edits the app (swapping a source is a
# schema-sensitive judgement call). When it finds drift it exits with a
# WARN/FAIL status; this workflow then opens — or updates in place — a single
# tracking issue so a human reviews it. The job itself stays green: the issue
# is the signal, matching the roster pattern of "officeholder/source changes
# get a human look before they ship."
#
# THE `wi-` PREFIX IS LOAD-BEARING. GitHub Actions reads workflows only from
# the repository ROOT's .github/workflows, so this file has to live here to
# run at all — and at the root it shares a namespace with the other three
# instances (the root validate-sources.yml is Illinois's). Every path below is
# instance-scoped for the same reason. This workflow was MISSING for the
# instance's first day — wi/scripts/validate_sources.py existed complete and
# nothing scheduled it, while CA and NY both had theirs — which is exactly the
# silent-absence class the fleet's gates otherwise catch; recorded here so the
# next instance's checklist includes it (docs/WI_PHASE2_PLAN.md PR 0).
#
# Cron: 1st of the month 13:00 UTC — NY runs 12:00, CA and IL 14:00; a free
# slot keeps the monthly issues from racing each other on the shared runner
# pool.

on:
  schedule:
    - cron: "0 13 1 * *" # 1st of the month, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        # Only requests is needed (no BeautifulSoup/Playwright); pinned via
        # wi/scripts/requirements.txt.
        run: pip install -c wi/scripts/requirements.txt requests

      - name: Validate layer sources
        id: validate
        # continue-on-error: a FAIL exit (1) must not red the job — per the
        # project's "surface for a human, don't block" convention, the tracking
        # issue below is the signal. status.txt carries ok|warn|fail.
        continue-on-error: true
        run: |
          python3 wi/scripts/validate_sources.py \
            --report source-report.md \
            --status-file status.txt
          echo "status=$(cat status.txt)" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.validate.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="WI layer source drift — review needed"
          # Prepend a short header so the issue explains itself, then the report.
          {
            echo "_Automated by \`.github/workflows/wi-validate-sources.yml\` on $(date -u +%Y-%m-%d). Nothing was changed in the app — review each item, then update \`wi/index.html\` (source URLs) or re-run the relevant \`wi/scripts/build_*.py\` as needed. Close this issue once addressed; it will reopen/refresh on the next run if drift remains._"
            echo
            cat source-report.md
          } > issue-body.md

          # Search NARROWS; the exact title comparison DECIDES. `gh issue list
          # --search` ANDs the terms and can return a near-miss, and this repo
          # carries four instances' source-drift issues — taking the first
          # hit would let one instance's monthly run overwrite another's body.
          # TITLE is exported, not a command prefix: the prefix form would set
          # it for `gh` only, and the reader on the other side of the pipe is a
          # separate process.
          export TITLE="$title"
          existing="$(gh issue list --state open --search "in:title $title" --json number,title \
            | python3 -c 'import json,os,sys; t=os.environ["TITLE"]; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == t), ""))')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" --body "Refreshed by the monthly source-validation run — see the updated issue body for the current status."
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
            echo "Opened a new tracking issue."
          fi
