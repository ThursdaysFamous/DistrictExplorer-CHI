name: Update Detroit council roster

# Weekly refresh of Detroit's nine City Council members
# (mi/data/app/mi-detroit-council-members.json, read by mi/index.html's
# `detroit-council` card). Seven sit on the district polygons and two are
# elected at large (2012 charter Art. 4 §4-101); the at-large pair ships beside
# the district member so the card does not answer seven ninths of the question
# and look complete doing it.
#
# THE SOURCE IS UNREACHABLE AND THE ROSTER IS STILL WEEKLY. detroitmi.gov sits
# behind a Cloudflare managed challenge on every path and every rung this
# project is willing to use, so the scraper's terminal rung reads the Internet
# Archive's copy of the city's own council page — the same rung Kendall and
# McHenry have used since 2026-07. A snapshot older than 45 days is REFUSED
# rather than served, so this cannot go quietly stale: the run fails loudly and
# a human looks, which is the whole point of the ceiling.

on:
  schedule:
    - cron: "30 18 * * 3" # Wednesday 18:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers). Falls back to github.token when
      # the secret is absent, so the refresh still runs — it just goes back to
      # opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Stdlib only, deliberately: mi/scripts carries no third-party HTTP
      # dependency and this scraper adds none, so there is no pip line here for
      # scripts/validate_workflow_deps.py to hold it to.
      - name: Scrape the council roster (live rung, then the Internet Archive)
        run: python3 mi/scripts/mi_detroit_council_scraper.py

      # Refuses on anything but exactly seven districts numbered 1..7 plus two
      # at-large seats, on a duplicate name, or on a profile link that leaves
      # detroitmi.gov.
      - name: Rebuild the Detroit council roster
        run: python3 mi/scripts/build_mi_detroit_council_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 mi/scripts/validate_index.py mi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mi/data/app/mi-detroit-council-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/detroit-council-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with — see update-mi-legislature-roster.yml for the
          # measured reason (a workflow-file change on main during a long run
          # reads as this push updating a workflow, which the token cannot do).
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add mi/data/app/mi-detroit-council-members.json
          git commit -m "Update Detroit council roster"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Detroit council roster" \
              --body "Automated weekly refresh of the \`detroit-council\` card's roster — Detroit's nine City Council members, seven by district and two at large. Generated by \`mi/scripts/mi_detroit_council_scraper.py\` into \`mi/scripts/build_mi_detroit_council_roster.py\`. THE SOURCE IS THE CITY'S OWN COUNCIL PAGE READ THROUGH THE INTERNET ARCHIVE: detroitmi.gov refuses this client with a Cloudflare managed challenge, which this project does not defeat, so the terminal rung reads a public archive of that same page and the card prints which day's copy it used. A snapshot older than 45 days is refused rather than served. No phone or e-mail is carried because the city publishes none on either surface (gap \`detroit-council-contact\`). Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
