name: Update MPD district captains roster

# Weekly refresh of the Milwaukee Police District card's commanding-officer
# roster (wi/data/app/mpd-district-captains.json). The source is the city's
# own per-district pages (city.milwaukee.gov/police/districts/District-1..7),
# which the 2026-08-27 recon measured answering PLAIN, HTTP 200, from
# GitHub's runners — the phase-3 "refuses every automated client" record was
# true only of the development sandbox's clients (the WEC probe's lesson).
# THIS WORKFLOW'S RUNNER IS THE SCRAPER'S VANTAGE: a local run in the
# sandbox is expected to fail its fetches, exactly as Johnson's and Perry's
# builders never read their blocked county sites.
#
# The scrape is heading-anchored (each page's "MPD District <n>" h2 is
# followed by the commanding officer's h3 — including District 2's measured
# markup trap, the word "Captain" split as "Captai n"), floored at 6 of 7
# named, and refuses a name appearing under two districts. Phones pair from
# the city Directory page's per-district tel: links (the 414-935-72x2
# block). If anything changed, a PR opens for human review — names never
# auto-commit to main.

on:
  schedule:
    - cron: "30 16 * * 1" # Monday 16:30 UTC (after the Monday MPS run)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c wi/scripts/requirements.txt requests

      - name: Scrape the city's per-district pages
        run: python3 wi/scripts/mpd_captains_scraper.py --out /tmp/mpd_captains.json

      - name: Rebuild the captains roster
        run: python3 wi/scripts/build_mpd_captains_roster.py /tmp/mpd_captains.json

      - name: Regenerate the history page
        run: python3 scripts/build_history_page.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/mpd-district-captains.json wi/history.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/mpd-captains-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add wi/data/app/mpd-district-captains.json wi/history.html
          git commit -m "Update MPD district captains from the city's own district pages"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update MPD district captains from the city's own district pages" \
              --body "Automated weekly refresh of the Police District (Milwaukee) card's commanding-officer roster, generated by \`wi/scripts/mpd_captains_scraper.py\` + \`build_mpd_captains_roster.py\` from city.milwaukee.gov's per-district pages. Please review the diff before merging — this changes data about real officers; a district whose page names nobody ships null and its card keeps the link-only behavior." \
              --base main \
              --head "$branch"
          else
            gh pr comment "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" \
              --body "Refreshed by this week's scheduled run — the branch was force-updated with the latest scrape."
          fi
