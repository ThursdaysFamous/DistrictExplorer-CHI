name: Publish engine release

# docs/MECHANIZATION_PLAYBOOK.md, Conversion 1 — the engine is distributed as
# a versioned, hash-verified release artifact published from CHI (the
# reference implementation), not by humans porting diffs.
#
# On tag push engine-v*:
#   1. build engine.bundle.js + engine.manifest.json (byte-deterministic;
#      scripts/build_engine_artifact.py),
#   2. refuse to publish unless the tag and the built sha256 match the
#      engine.lock.json pin — CHI consumes its own releases at deploy time,
#      so a release the lockfile doesn't pin would fail the very next deploy,
#   3. self-check: round-trip (apply the freshly built bundle into scratch
#      copies -> byte-identical), then the merge gate + behaviour gate,
#   4. `gh release create` with the bundle, manifest, and the shared scripts
#      as assets — the release is the distribution channel for shared
#      scripts: the consume side (apply_engine.py + its parser
#      check_engine_parity.py) and the Conversion 2 toolchain
#      (generate_metro_files.py + the metro-worksheet schema, which forks
#      place at schema/metro-worksheet.schema.json).
#      OWNER SETUP: enable immutable releases on this repo (Settings ->
#      General -> Releases) so a published engine can never be re-pointed,
#   5. fan out repository_dispatch (event_type: engine-release) to every
#      sibling fork so each opens its own gated version-bump PR. Needs the
#      ENGINE_DISPATCH_TOKEN secret: a fine-grained PAT scoped to ONLY the
#      sibling repos, Contents read/write + Metadata read. Payload is capped
#      at 10 top-level properties; send engine_version + sha256, nothing else.
#
# Re-running the workflow is safe: if the release already exists, creation is
# skipped and only the fan-out repeats (a dispatch is idempotent on the
# sibling side — its bump PR lives on a fixed bot branch).

# workflow_dispatch exists for tags created by create-engine-tag.yml: a tag
# pushed with a workflow's own GITHUB_TOKEN never fires on:push:tags (GitHub
# suppresses recursive triggers), so after that workflow creates the tag, run
# THIS one manually AT THE TAG REF (Actions -> select the engine-v* tag).
# GITHUB_REF_NAME is then the tag name, exactly as in the push path, so the
# lockfile verification below is identical either way. Dispatching it on a
# branch ref fails that verification by design.
on:
  push:
    tags: ["engine-v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the release on this repo
  actions: write # re-dispatch the Pages deploy that raced this publish

# One pin, two consumers: the npm install and the browser-cache key below must
# name the same Playwright version, or a bump re-downloads Chromium forever
# against a stale cache key. Defined once so they cannot drift.
env:
  PLAYWRIGHT_VERSION: "1.56.1"

jobs:
  release:
    runs-on: ubuntu-latest
    # A CEILING ON THE WHOLE JOB, added 2026-08-18 after three runs in two days
    # sat "in_progress" long enough to look hung — 57 minutes, then 35, then 16,
    # every one of them on the Playwright install below. THEY WERE NOT UNBOUNDED
    # HANGS, which is the thing worth knowing: the install's first retry ladder
    # was bounded but could stack ~30 minutes of grinding that reports nothing
    # and, on deploy-pages, holds the Pages concurrency slot so every
    # later deploy queues behind it. A bounded-but-half-hour step is
    # indistinguishable from a hang to anyone watching, and the only thing that
    # caught all three was comparing the live site against the repo by hand.
    # This makes that state VISIBLE — a red run a human can act on — instead of
    # silent. The install step now sizes its phase budgets to fail NAMED under
    # its own 15-minute cap, so this ceiling guards the OTHER steps and true
    # catastrophes, not the install's ordinary sick days.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build engine artifact
        run: python3 scripts/build_engine_artifact.py --out dist/ --version "$GITHUB_REF_NAME"

      - name: Verify tag + sha256 match the engine.lock.json pin
        run: |
          lock_ver="$(jq -r .engine_version engine.lock.json)"
          lock_sha="$(jq -r .sha256 engine.lock.json)"
          built_sha="$(jq -r .sha256 dist/engine.manifest.json)"
          if [ "$GITHUB_REF_NAME" != "$lock_ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the engine.lock.json pin ($lock_ver) — bump the lockfile in a reviewed PR before tagging"
            exit 1
          fi
          if [ "$built_sha" != "$lock_sha" ]; then
            echo "::error::built bundle sha256 ($built_sha) does not match the engine.lock.json pin ($lock_sha) — the fenced engine changed after the lockfile was written; rebuild and re-pin in a PR"
            exit 1
          fi

      - name: Self-check — round-trip apply is byte-identical
        run: |
          mkdir rt
          cp index.html sw.js rt/
          python3 scripts/apply_engine.py \
            --bundle dist/engine.bundle.js --manifest dist/engine.manifest.json \
            --index rt/index.html --sw rt/sw.js
          cmp index.html rt/index.html
          cmp sw.js rt/sw.js
          rm -rf rt

      - name: Self-check — static merge gate
        run: python3 scripts/validate_index.py index.html

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same pinned toolchain as smoke-test.yml (node_modules is never
      # committed — this repo has no build step). The cache + timeout/retry
      # pair mirrors smoke-test.yml, which carries the full story (the
      # 2026-08-18 CDN hangs).
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        # Backstop for a multi-phase failure day. The ladder inside is sized to
        # fail NAMED under this cap when any ONE phase is sick (budgets in the
        # run body); two-plus sick phases at once is what this cap is for.
        timeout-minutes: 15
        run: |
          # Phase budgets, sized so any SINGLE sick phase fails with a NAMED
          # error inside the step's 15-minute cap — the cap stays the
          # multi-phase backstop, never the first line of defence:
          #   npm      3 x 60s   (normally ~2 s; lock-free, retry-safe)
          #   apt      1 x 420s  (normally seconds; NEVER retried in-process —
          #            a timeout-killed apt orphans apt-get still holding
          #            /var/lib/dpkg/lock-frontend, so every in-job retry dies
          #            on the corpse's lock, proven live in the SF fork. A
          #            mirror too sick for 7 minutes needs a fresh runner,
          #            and only a re-run provides one.)
          #   browser  2 x 300s  on a cache miss only (the CDN fetch that hung
          #            28 minutes in the Chicago fork; lock-free, retry-safe)
          retry() {
            local attempts=$1 budget=$2; shift 2
            for i in $(seq 1 "$attempts"); do
              timeout "$budget" "$@" && return 0
              echo "::warning::attempt $i/$attempts of '$*' hung or failed"
              sleep 5
            done
            echo "::error::'$*' failed $attempts time(s) at ${budget}s each"
            return 1
          }
          retry 3 60 npm install "playwright@${PLAYWRIGHT_VERSION}"
          retry 1 420 npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            retry 2 300 npx playwright install chromium
          fi

      - name: Self-check — behaviour gate (serve + smoke test)
        env:
          BASE_URL: http://localhost:8000/
        run: |
          python3 -m http.server 8000 &
          server_pid=$!
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 0.5
          done
          node scripts/smoke_test.mjs
          status=$?
          kill "$server_pid" 2>/dev/null || true
          exit $status

      - name: Publish release (bundle + manifest + consume-side scripts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/engine-changelog/${GITHUB_REF_NAME#engine-}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes — every engine release ships human-written changelog notes"
            exit 1
          fi
          # The releases/tags endpoint returns PUBLISHED releases only — a
          # draft left behind by an earlier failed run 404s here, so it can
          # never masquerade as published and skip straight to a phantom
          # fan-out (`gh release view` would). If a leftover draft then makes
          # `gh release create` fail, that surfaces loudly for a human.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --silent 2>/dev/null; then
            echo "release $GITHUB_REF_NAME already published — skipping create (re-run for fan-out only)"
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/engine.bundle.js dist/engine.manifest.json \
              scripts/apply_engine.py scripts/check_engine_parity.py \
              scripts/generate_metro_files.py schema/metro-worksheet.schema.json \
              --title "Engine ${GITHUB_REF_NAME#engine-}" \
              --notes-file "$notes" \
              --verify-tag
          fi

      # The other half of the publish-race fix (see THE PUBLISH RACE in
      # deploy-pages.yml). The bump merge fires a deploy before this release
      # exists; that deploy waits, but only for a bounded window. Dispatching
      # one here means the site ships as soon as its input exists no matter how
      # long the tag/publish steps took — no manual re-run, which is what both
      # v1.0.17 and v1.0.18 needed. Cheap and idempotent when the racing deploy
      # already succeeded: main deploys whatever main pins, and the `pages`
      # concurrency group serializes the two so they cannot interleave.
      #
      # Deliberately NOT gated on "did we just create the release" — a re-run
      # for fan-out only should still heal a deploy that failed earlier. It is
      # gated on main actually pinning this release, so re-running an OLD
      # release's workflow cannot publish a deploy main did not ask for.
      - name: Re-dispatch the Pages deploy if main pins this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # raw media type, so this reads the file itself instead of decoding
          # the base64 the contents endpoint otherwise wraps it in
          pinned="$(gh api "repos/$GITHUB_REPOSITORY/contents/engine.lock.json?ref=main" \
            -H 'Accept: application/vnd.github.raw' | jq -r .engine_version)"
          if [ "$pinned" != "$GITHUB_REF_NAME" ]; then
            echo "main pins $pinned, not $GITHUB_REF_NAME — no deploy dispatched"
            exit 0
          fi
          gh workflow run deploy-pages.yml --ref main
          echo "dispatched deploy-pages.yml on main (pins $pinned)"

      - name: Fan out repository_dispatch to sibling forks
        env:
          GH_TOKEN: ${{ secrets.ENGINE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret ENGINE_DISPATCH_TOKEN is not set — create a fine-grained PAT scoped to only the sibling repos (Contents read/write, Metadata read), add it as ENGINE_DISPATCH_TOKEN, then re-run this workflow. The release itself is already published; only the fan-out is pending."
            exit 1
          fi
          sha="$(jq -r .sha256 dist/engine.manifest.json)"
          # EVERY sibling fork belongs in this list (and in the
          # ENGINE_DISPATCH_TOKEN PAT's repo scope) the day it goes live —
          # SF missed the v1.0.6 fan-out because this list stopped at NYC.
          for sibling in ThursdaysFamous/DistrictExplorer-NYC ThursdaysFamous/DistrictExplorer-SF; do
            gh api "repos/$sibling/dispatches" \
              -f event_type=engine-release \
              -f "client_payload[engine_version]=$GITHUB_REF_NAME" \
              -f "client_payload[sha256]=$sha"
            echo "dispatched engine-release ($GITHUB_REF_NAME) to $sibling"
          done
