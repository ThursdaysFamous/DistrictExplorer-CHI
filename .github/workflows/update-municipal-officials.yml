name: Update municipal officials roster

# Weekly refresh of the Municipality card's governing-body roster
# (data/app/municipal-officials.json, fetched by index.html). Re-scrapes each
# sourced county's official directory and, if anything changed, opens a PR
# rather than committing directly to main — officeholder data should get a
# human look before it ships.
#
# Cook is the shipped county (the County Clerk's Directory of Elected
# Officials API). The remaining six counties land here as additional scrape
# steps as they are built, each appending its own intermediate file to the
# builder invocation; docs/MUNICIPAL_COUNCILS_PLAYBOOK.md holds the source
# ladder and the merge/precedence rule.

on:
  schedule:
    - cron: "0 14 * * 3" # Wednesday 14:00 UTC (after the CCPSA job at 13:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Version-pinned via scripts/requirements.txt (constraints). The Cook
        # source is a plain JSON API, so only requests is needed today; the
        # scraper's playwright rung is opt-in and unused unless Cloudflare
        # starts challenging plain clients.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the Cook County Clerk directory of elected officials
        id: scrape_cook
        continue-on-error: true
        run: python3 scripts/cook_municipal_officials_scraper.py --out /tmp/cook_municipal_officials.json

      # A source that blocks or breaks is an expected state, not a red build:
      # the shipped roster keeps its last good values and one standing issue
      # tracks the block (the validate-sources pattern).
      - name: Track a blocked or broken source
        if: steps.scrape_cook.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Municipal officials: Cook County source unavailable"
          existing="$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')"
          body="The weekly municipal-officials refresh could not fetch the Cook County Clerk's Directory of Elected Officials API on $(date -u +%Y-%m-%d). The shipped roster is unchanged and still serves its last verified values. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Rebuild roster data file
        if: steps.scrape_cook.outcome == 'success'
        run: python3 scripts/build_municipal_officials_roster.py /tmp/cook_municipal_officials.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        if: steps.scrape_cook.outcome == 'success'
        run: python3 scripts/validate_index.py index.html

      - name: Check for changes
        id: diff
        if: steps.scrape_cook.outcome == 'success'
        run: |
          if git diff --quiet -- data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.scrape_cook.outcome == 'success' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/municipal-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/app/municipal-officials.json
          git commit -m "Update municipal officials roster from the county clerk directories"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update municipal officials roster from the county clerk directories" \
              --body "Automated weekly refresh of the Municipality card's governing-body roster, generated by \`scripts/cook_municipal_officials_scraper.py\` + \`scripts/build_municipal_officials_roster.py\` from the Cook County Clerk's Directory of Elected Officials. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
