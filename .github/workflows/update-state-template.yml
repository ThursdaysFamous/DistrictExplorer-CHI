name: Update state template

# Regenerates the state-expansion template repo from this tree and pushes it —
# the template is a GENERATED ARTIFACT of this reference repo (see
# docs/EXPANSION_GUIDE.md §4.10 and scripts/build_state_template.py's
# docstring), so it can never rot the way a hand-cut skeleton would. Runs:
#   * on demand (workflow_dispatch — the operator runbook's step after
#     creating the empty template repo),
#   * weekly (scaffolding fixes that didn't touch the hermetic --check
#     surface still flow out within a week),
#   * after every engine release (release-engine.yml dispatches this once its
#     fan-out completes, so the template re-pins the new engine the same day
#     the sibling forks get their bump PRs).
#
# Before anything is pushed, the built template is proven END TO END: a real
# bootstrap run against a test state (Indiana, FIPS 18) — TIGERweb fetches,
# congress roster, worksheet rewrite, token fill — then the bootstrapped
# tree's own gate battery and its own Playwright smoke test. A template that
# cannot become a booting state app does not ship. (Live network is fine
# here — this is a scheduled/dispatch job, never a PR gate, the same posture
# as validate-sources.yml.)
#
# The push is PLAIN (never force): the template repo is supposed to have no
# hand-made commits, so a non-fast-forward push failing loudly is the alarm
# that someone hand-edited the artifact — resolve by deleting their commit or
# folding the change into CHI, never by forcing over it.

on:
  workflow_dispatch: {} # also dispatched by release-engine.yml after its fan-out
  schedule:
    - cron: "0 12 * * 2" # Tuesday 12:00 UTC

permissions:
  contents: read

env:
  # The template repo this workflow maintains. Also belongs in the
  # ENGINE_DISPATCH_TOKEN PAT's repo scope (Contents read/write).
  TEMPLATE_REPO: ThursdaysFamous/DistrictExplorer-Template
  PLAYWRIGHT_VERSION: "1.56.1"
  TEST_STATE_FIPS: "18"
  TEST_STATE_NAME: "Indiana"

jobs:
  build-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the template tree
        run: |
          pip install -c scripts/requirements.txt jsonschema
          python3 scripts/build_state_template.py --out "$RUNNER_TEMP/template"

      - name: Bootstrap the test state in a scratch copy (e2e proof)
        run: |
          cp -a "$RUNNER_TEMP/template" "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          python3 scripts/bootstrap_state.py \
            --state-fips "$TEST_STATE_FIPS" --state-name "$TEST_STATE_NAME" \
            --repo example/DistrictExplorer-TEST --domain template-e2e.invalid \
            --brand-name "$TEST_STATE_NAME District Explorer"
          python3 scripts/check_template_placeholders.py
          python3 scripts/validate_index.py index.html

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        timeout-minutes: 15
        run: |
          retry() {
            local attempts=$1 budget=$2; shift 2
            for i in $(seq 1 "$attempts"); do
              timeout "$budget" "$@" && return 0
              echo "::warning::attempt $i/$attempts of '$*' hung or failed"
              sleep 5
            done
            echo "::error::'$*' failed $attempts time(s) at ${budget}s each"
            return 1
          }
          cd "$RUNNER_TEMP/e2e"
          retry 3 60 npm install "playwright@${PLAYWRIGHT_VERSION}"
          retry 1 420 npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            retry 2 300 npx playwright install chromium
          fi

      - name: Smoke-test the bootstrapped state app
        env:
          BASE_URL: http://localhost:8000/
        run: |
          cd "$RUNNER_TEMP/e2e"
          python3 -m http.server 8000 &
          server_pid=$!
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 0.5
          done
          node scripts/smoke_test.mjs
          status=$?
          kill "$server_pid" 2>/dev/null || true
          exit $status

      - name: Push the template repo
        env:
          GH_TOKEN: ${{ secrets.ENGINE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ENGINE_DISPATCH_TOKEN is not set (or lacks $TEMPLATE_REPO in its repo scope) — the template build passed e2e but cannot be pushed."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATE_REPO}.git" "$RUNNER_TEMP/dest" 2>/dev/null \
            || { git init -b main "$RUNNER_TEMP/dest"; cd "$RUNNER_TEMP/dest"; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TEMPLATE_REPO}.git"; cd -; }
          # replace contents wholesale (minus .git) — the template has no
          # hand-owned files by contract
          find "$RUNNER_TEMP/dest" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/template/." "$RUNNER_TEMP/dest/"
          cd "$RUNNER_TEMP/dest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Template already current — nothing to push."
            exit 0
          fi
          engine="$(jq -r .engine_version engine.lock.json)"
          git commit -m "template: regenerate from CHI@${GITHUB_SHA::12} (${engine})"
          git push origin HEAD:main
