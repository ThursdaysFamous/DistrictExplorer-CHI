name: Update Washington County Board roster

# Weekly refresh of the Washington County Board District card's member roster
# (data/app/washington-county-board-members.json, fetched by index.html) — and,
# just as importantly, the weekly DRIFT CHECK on that county's derived
# district boundary.
#
# Washington runs NO GIS at all; the shipped boundary is Census townships
# dissolved per the whole-township composition printed on this very page. So
# the builder re-reads that composition every week and FAILS if it no longer
# matches the one compiled into scripts/build_washington_board_districts.py.
# A redistricting therefore turns this job red instead of leaving the shipped
# lines quietly a cycle out of date.
#
# Two things to watch in this job's log rather than in the diff: the builder
# WARNs when a member's published e-mail domain looks like a misspelling of
# the county's own (one currently is, and it ships as published — correcting
# an officeholder's contact details is the county's call), and the scraper
# deliberately never collects the HOME ADDRESSES the county prints for all
# fifteen members.
#
# If the job fails on a composition change, the fix is to re-read the county
# board page, update DISTRICTS in build_washington_board_districts.py, and
# regenerate data/app/washington-county-board-districts.json.

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Plain server-rendered HTML.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape roster
        run: python3 scripts/washington_county_board_scraper.py /tmp/raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_washington_board_roster.py /tmp/raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/washington-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/app/washington-county-board-members.json
          git commit -m "Update Washington County Board roster from iroquoiscountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Washington County Board roster from iroquoiscountyil.gov" \
              --body "Automated weekly refresh of the Iroquois County Board District card's member roster (4 districts, four members each, with phones, e-mails, home towns and term-expiry years), generated by \`scripts/washington_county_board_scraper.py\` + \`scripts/build_washington_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
