name: Update IA city contact roster

# Weekly refresh of the office phone and website of every one of Iowa's 939
# incorporated cities (ia/data/app/ia-city-contact.json, read by
# ia/index.html's City card).
#
# THIS IS NOT A ROSTER OF PEOPLE, and the card says so. No statewide source
# names Iowa's mayors, council members or clerks — measured across four routes
# on 2026-09-03, and recorded as the open `ia-municipal-officeholders` gap.
# What the Iowa League of Cities publishes is a row per CITY: name, county,
# population, website, phone, and no column naming a person. That source was on
# file in this repo as "a membership directory with no public officials export"
# and, elsewhere, as membership-gated; it is not gated, and the old wording was
# right about the officeholders and wrong about the directory.
#
# WHAT THIS RUN IS REALLY WATCHING is the join. build_ia_city_contact.py
# refuses to write unless ALL 939 TIGERweb places still get a League row (one
# alias: the League's Jewell is TIGER's Jewell Junction) and unless the nine
# rows that correctly do not join keep their measured shape — two county
# entries, one header artifact, and six tiny places TIGERweb's
# incorporated-places layer does not carry. A city incorporating, dissolving or
# being renamed upstream therefore fails this job loudly instead of quietly
# leaving one card without a way to reach its city hall.

on:
  schedule:
    - cron: "30 15 * * 5" # Friday 15:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers). Falls back to github.token when
      # the secret is absent, so the refresh still runs — it just goes back to
      # opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The builder fetches both sources itself with curl (preinstalled) — the
      # League's table needs browser headers or the body arrives truncated, and
      # TIGERweb needs none. Nothing to pip install.
      - name: Rebuild the city contact roster
        run: python3 ia/scripts/build_ia_city_contact.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present,
      # well formed and cached in exactly one service-worker list.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-city-contact.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged refresh PR is updated in
          # place by the force-push below instead of spawning a duplicate every
          # week.
          branch="bot/ia-city-contact-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, and if main gains a
          # .github/workflows/ change meanwhile, the branch ends up differing
          # from main THERE too — which GitHub reads as the push updating a
          # workflow and refuses for a token without `workflow` scope. Measured
          # 2026-09-02 on update-municipal-officials.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add ia/data/app/ia-city-contact.json
          git commit -m "Update IA city contact roster from the Iowa League of Cities"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update IA city contact roster from the Iowa League of Cities" \
              --body "Automated weekly refresh of the office phone and website carried on Iowa's City card, generated by \`ia/scripts/build_ia_city_contact.py\` from the Iowa League of Cities' own city table joined to TIGERweb's incorporated places.

This names no officeholder — the League's table has no column that does, which is why the \`ia-municipal-officeholders\` gap stays open. A diff here is a city changing its phone or its website, or the join moving. **A change in the number of cities is the one worth reading closely**: the builder refuses to write unless all 939 TIGER places still join, so if this PR exists at all that gate passed, but the record of which places are absent from TIGERweb may need re-measuring." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
