name: Smoke test

# Headless boot + behaviour check on every pull request: serves the real
# index.html and drives it in Chromium (scripts/smoke_test.mjs) to confirm the
# app boots, registers all 18 layers, classifies a known point with the three
# no-API layers, and degrades gracefully when a data source fails. This is the
# validation the README describes; it runs before merge so a change that breaks
# boot or the data files can't land unnoticed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# One pin, two consumers: the npm install and the browser-cache key below must
# name the same Playwright version, or a bump re-downloads Chromium forever
# against a stale cache key. Defined once so they cannot drift.
env:
  PLAYWRIGHT_VERSION: "1.56.1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Conversion 2 drift gate (CHI docs/MECHANIZATION_PLAYBOOK.md): every
      # GENERATED region must match what metro-worksheet.json generates.
      # Hand-editing a generated region fails here — edit the worksheet and
      # run scripts/generate_metro_files.py instead.
      - name: Generated regions match the worksheet
        run: |
          pip install -c scripts/requirements.txt jsonschema
          python3 scripts/generate_metro_files.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned to the version the test was authored against. Installs into the
      # ephemeral workspace only (node_modules is never committed — this repo
      # has no build step).
      #
      # Chromium (~170 MB) used to be re-fetched from Playwright's CDN on
      # every run, and on 2026-08-18 that fetch hung twice in the Chicago fork
      # — 28 and 14 minutes against a normal ~23 s step — each needing a
      # manual cancel + re-run (ported from DistrictExplorer-CHI#378). Two
      # guards, either sufficient alone: the browser build is CACHED keyed on
      # the pinned version (a hit skips the CDN entirely; only the apt-side
      # install-deps still runs, and the runner image pre-satisfies most of
      # it), and every install runs under timeout+retry so a hang on a cache
      # miss dies at five minutes and retries instead of eating the job's
      # whole budget. The other workflows running this toolchain carry the
      # same pair and point here for the story.
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: |
          try3() {
            for i in 1 2 3; do
              timeout 300 "$@" && return 0
              echo "::warning::attempt $i/3 of '$*' hung or failed — retrying"
              sleep 5
            done
            echo "::error::'$*' failed three times (five-minute timeout each)"
            return 1
          }
          try3 npm install "playwright@${PLAYWRIGHT_VERSION}"
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            try3 npx playwright install-deps chromium
          else
            try3 npx playwright install --with-deps chromium
          fi

      - name: Serve app and run smoke test
        env:
          BASE_URL: http://localhost:8000/
        run: |
          python3 -m http.server 8000 &
          server_pid=$!
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 0.5
          done
          node scripts/smoke_test.mjs
          status=$?
          kill "$server_pid" 2>/dev/null || true
          exit $status
