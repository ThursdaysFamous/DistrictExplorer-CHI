name: Update IA judicial district roster

# Weekly refresh of Iowa's 8 judicial election districts' bench
# (ia/data/app/ia-judicial-judges.json, read by ia/index.html's Judicial
# District card). Source is each district's own "Judges and Magistrates"
# roster page at iowacourts.gov (three different URL shapes -- see
# ia_judicial_district_scraper.py). Judges are RETENTION, never elected.
#
# This run also re-verifies the GEOMETRY (ia-judicial-districts.json) via
# build_ia_judicial_district.py --check, which re-fetches the LSAFiscal
# organization's own published district polygons and re-proves every
# county's crosswalk assignment against them -- the redistricting tripwire
# for this layer, since Iowa Code SS602.6107(3) allows the county
# composition to be revised. That step never writes; only the roster
# scrape below can produce a diff for this workflow to PR.

on:
  schedule:
    - cron: "30 16 * * 4" # Thursday 16:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests

      - name: Re-verify the district geometry against the LSAFiscal witness
        run: python3 ia/scripts/build_ia_judicial_district.py --check

      - name: Scrape each district's judges and magistrates page
        run: python3 ia/scripts/ia_judicial_district_scraper.py

      - name: Rebuild the judicial district roster
        run: python3 ia/scripts/build_ia_judicial_district_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-judicial-judges.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ia-judicial-district-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add ia/data/app/ia-judicial-judges.json
          git commit -m "Update IA judicial district roster from iowacourts.gov"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update IA judicial district roster from iowacourts.gov" \
              --body "Automated weekly refresh of the Iowa Judicial District card's bench, generated by \`ia/scripts/build_ia_judicial_district_roster.py\` from each district's own \"Judges and Magistrates\" page (\`ia_judicial_district_scraper.py\`). Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
