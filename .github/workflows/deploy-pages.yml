name: Deploy to GitHub Pages

# Publishes only the files the app actually serves — index.html, sw.js,
# manifest.webmanifest, CNAME, .nojekyll, icons/, and data/app/*.json — instead
# of the whole branch. The classic "Deploy from a branch" flow shipped the entire
# tree to the CDN: the scrapers/builders (scripts/), the docs (docs/), and ~5 MB
# of build-only geometry (data/source/ raw zips+xlsx and the three full-precision
# data/*.geojson originals that data/app/*.json is simplified from). None of that
# is fetched at runtime, so this assembles a curated site directory and uploads
# that as the Pages artifact.
#
# ONE-TIME OWNER SETUP REQUIRED: this workflow only takes effect once the repo's
# Pages *source* is switched from "Deploy from a branch" to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source). Until then the classic
# branch deploy keeps serving the live site and this job's final deploy step will
# fail (harmless — no outage, the classic deploy is still authoritative). After
# the flip, this becomes the deploy path and the custom domain (CNAME) is
# preserved by shipping the CNAME file in the artifact.
#
# The exclude list below is the ONLY thing standing between "app files" and "app
# files + 5 MB of build inputs". Keep data/app in and data/source + data/*.geojson
# out when either moves.
#
# ENGINE ASSEMBLY (docs/MECHANIZATION_PLAYBOOK.md, Conversion 1): before the
# site is assembled, the fenced ENGINE blocks in index.html and sw.js are
# replaced from the engine release pinned in engine.lock.json — download,
# sha256-verify against the lockfile, splice (scripts/apply_engine.py), then
# re-run the merge gate and the behaviour gate on the assembled tree. Parity
# with the sibling forks is true by construction: every fork deploys the same
# hash-pinned bytes instead of trusting hand-ported diffs.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token set the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it mid-publish (which could leave the site half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

# One pin, two consumers: the npm install and the browser-cache key below must
# name the same Playwright version, or a bump re-downloads Chromium forever
# against a stale cache key. Defined once so they cannot drift.
env:
  PLAYWRIGHT_VERSION: "1.56.1"

# Two jobs (the standard Pages layout): `assemble` carries no environment, so
# it runs on ANY ref — which is what lets a corruption drill (and any future
# branch verification) actually exercise the hash gate; the github-pages
# environment's branch protection rejects non-main jobs before a single step
# runs, so a one-job layout can never fail at sha256sum on a branch. `deploy`
# keeps the environment gate and only runs for main. (Ported from the NYC
# fork, which hit exactly this in its Phase 1.5 drill.)
jobs:
  assemble:
    runs-on: ubuntu-latest
    # A CEILING ON THE WHOLE JOB, added 2026-08-18 after three runs in two days
    # sat "in_progress" long enough to look hung — 57 minutes, then 35, then 16,
    # every one of them on the Playwright install below. THEY WERE NOT UNBOUNDED
    # HANGS, which is the thing worth knowing: that step's try3 ladder already
    # caps each attempt at 300s, but it runs up to three attempts against each of
    # TWO commands, so its own worst case is ~30 minutes of grinding that reports
    # nothing and, on deploy-pages, holds the Pages concurrency slot so every
    # later deploy queues behind it. A bounded-but-half-hour step is
    # indistinguishable from a hang to anyone watching, and the only thing that
    # caught all three was comparing the live site against the repo by hand.
    # This makes that state VISIBLE — a red run a human can act on — instead of
    # silent.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Any failure here — including a release that never appears — FAILS the
      # deploy: the site never ships without hash-verified engine assembly.
      # (The bootstrap-window skip guard that used to live here was deleted
      # after engine-v1.0.0 published, per its TODO.)
      #
      # THE PUBLISH RACE. An engine bump lands on main as a normal merge, which
      # fires this workflow immediately — but the release that merge pins is
      # created afterwards, by create-engine-tag.yml then release-engine.yml.
      # For the minutes in between, main legitimately pins a release that does
      # not exist yet, and a single `gh release download` fails with a bare
      # "release not found". That is what it did for both engine-v1.0.17 and
      # v1.0.18, each needing a manual re-run once the release landed.
      #
      # So wait for it rather than failing on the first miss. Polling the
      # releases/tags endpoint (not `gh release view`) keeps the existing
      # draft rule: it returns PUBLISHED releases only, so a draft left by a
      # failed release run can never satisfy this wait. A release that is
      # already there costs one API call and no delay — the wait is only ever
      # paid inside the window it exists for. If it never arrives, the job
      # fails loudly and says exactly which two dispatches are outstanding;
      # release-engine.yml also dispatches this workflow once it publishes, so
      # a timed-out deploy still heals itself without anyone re-running it.
      - name: Fetch pinned engine release
        env:
          GH_TOKEN: ${{ github.token }}
          DEADLINE_S: "900" # 15 min — a human running the two dispatches by hand
        run: |
          tag="$(jq -r .engine_version engine.lock.json)"
          waited=0
          until gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>/dev/null; do
            if [ "$waited" -ge "$DEADLINE_S" ]; then
              echo "::error::engine release $tag is still not published after $((DEADLINE_S / 60))m. main pins it, so the site cannot ship without it. Run 'Create engine tag' (tag=$tag, sha=$GITHUB_SHA) then 'Publish engine release' at that tag ref; this deploy will be re-dispatched automatically once the release publishes."
              exit 1
            fi
            if [ "$waited" = 0 ]; then
              echo "::notice::$tag not published yet — waiting up to $((DEADLINE_S / 60))m for the release this commit pins (see THE PUBLISH RACE in this workflow)."
            fi
            sleep 20
            waited=$((waited + 20))
          done
          [ "$waited" -gt 0 ] && echo "$tag appeared after ${waited}s"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'engine.bundle.js' --pattern 'engine.manifest.json' --clobber

      # The TWO spaces between hash and filename are load-bearing — a single
      # space (or CRLF) breaks `sha256sum --check` parsing. The two
      # --against-bundle lines are the parity checker's demotion (playbook
      # migration step 4): no longer a cross-fork drift detector, it asserts
      # post-assembly that the spliced blocks equal the downloaded bundle.
      - name: Verify engine hash, apply, re-run static merge gate
        run: |
          echo "$(jq -r .sha256 engine.lock.json)  engine.bundle.js" | sha256sum --check -
          python3 scripts/apply_engine.py
          python3 scripts/validate_index.py index.html
          python3 scripts/check_engine_parity.py index.html --against-bundle engine.manifest.json --strict
          python3 scripts/check_engine_parity.py sw.js --against-bundle engine.manifest.json --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same pinned toolchain as smoke-test.yml. The behaviour gate re-runs
      # here because the assembled tree (committed files + spliced engine) is
      # what actually ships — smoke-test.yml only covered the committed tree.
      # The cache + timeout/retry pair mirrors smoke-test.yml, which carries
      # the full story (the 2026-08-18 CDN hangs).
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        # The ladder's realistic recovery is one retry per command (~11 min);
        # anything past that is not flakiness this job should keep absorbing.
        timeout-minutes: 15
        run: |
          # try3 guards the retry-SAFE fetches: npm and the browser CDN (the
          # fetch that actually hung). The apt phase is deliberately OUTSIDE
          # it — proven live in SF's first cached run: the timeout fired
          # mid-apt on a slow mirror, killed npx but orphaned apt-get still
          # holding /var/lib/dpkg/lock-frontend, and both retries died
          # instantly on the corpse's lock. A slow mirror makes progress and
          # finishes; a killed apt can never be retried in-job. So apt gets
          # ONE attempt under a generous timeout: wedged fails loudly at 15
          # minutes, slow just finishes.
          try3() {
            for i in 1 2 3; do
              timeout 300 "$@" && return 0
              echo "::warning::attempt $i/3 of '$*' hung or failed — retrying"
              sleep 5
            done
            echo "::error::'$*' failed three times (five-minute timeout each)"
            return 1
          }
          try3 npm install "playwright@${PLAYWRIGHT_VERSION}"
          timeout 900 npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            try3 npx playwright install chromium
          fi

      - name: Behaviour gate on the assembled tree (serve + smoke test)
        env:
          BASE_URL: http://localhost:8000/
        run: |
          python3 -m http.server 8000 &
          server_pid=$!
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 0.5
          done
          node scripts/smoke_test.mjs
          status=$?
          kill "$server_pid" 2>/dev/null || true
          exit $status

      - name: Assemble site (app files only — drop scripts/docs/raw data)
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='scripts' \
            --exclude='docs' \
            --exclude='data/source' \
            --exclude='icons/source' \
            --exclude='data/*.geojson' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='engine.lock.json' \
            --exclude='engine.bundle.js' \
            --exclude='engine.manifest.json' \
            --exclude='CLAUDE.md' \
            ./ _site/
          echo "Published tree:" && find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only main deploys; a branch dispatch stops after `assemble` (that run's
    # verdict IS the verification) instead of dying on the github-pages
    # environment's branch protection.
    if: github.ref == 'refs/heads/main'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
