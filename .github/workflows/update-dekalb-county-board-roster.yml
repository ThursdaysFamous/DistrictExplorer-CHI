name: Update DeKalb County Board roster

# Weekly refresh of the DeKalb County Board District card's member roster
# (data/app/dekalb-county-board-members.json, fetched by index.html).
# Re-scrapes the county's own members page (district, name, party, phone,
# @dekalbcounty.org email) plus its chairperson table, and, if anything changed,
# opens a PR rather than committing directly to main — officeholder data should
# get a human look before it ships.
#
# WHY THIS EXISTS WHEN THE BOUNDARY GIS CARRIES OFFICEHOLDERS.
# DeKalb's District_AreaEffective2022 service declares Member1/Member2 with
# their own phone and e-mail columns. Measured, both phone columns are populated
# on 0 of 12 districts and Member2_EMail on 10 of 12, while this page carries
# party, term, 22 phones and 24 e-mails. The GIS supplies geometry; the roster
# supplies the people.
#
# Only the ROSTER is on a cron. The boundary is live from the county's ArcGIS
# Online org on every card render, so there is nothing to rebuild for it.

on:
  schedule:
    - cron: "0 14 * * 5" # Friday 14:00 UTC (staggered from CCBR at Fri 13:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The members page is static, server-rendered WordPress — no JS is
        # needed to READ it. The browser is here for the edge, not the markup:
        # dekalbcounty.org answers with SiteGround's SG-Captcha stub (HTTP 202)
        # scored on the CALLER'S IP, and a runner address draws the stub far
        # harder than a residential one — the first scheduled run took it on all
        # six retries and failed. So this job runs the scraper's
        # requests -> playwright -> wayback ladder, same as McHenry and Kendall.
        run: pip install -c scripts/requirements.txt requests playwright

      - name: Install Chromium for Playwright
        run: python3 -m playwright install --with-deps chromium

      - name: Scrape DeKalb County Board member roster
        id: scrape
        # --engine auto walks the ladder and prints which rung carried each
        # fetch, so the run log answers "is this county blocked from CI?" by
        # itself rather than needing a separate probe. Measured that way on
        # 2026-08-02 the answer is YES, from a runner: requests took the stub on
        # all six attempts, a genuine headless Chromium sat on the interstitial
        # for a full 24s without ever reaching the document, and the Archive's
        # newest snapshot was 144 days old against the 45-day guard.
        #
        # So a total fetch failure is an EXPECTED state here, as it is for
        # McHenry and Kendall, and it feeds a standing tracking issue instead of
        # a red run every Friday. What is NOT expected is the same failure from
        # elsewhere: this source answers a well-reputed address fine (the
        # shipped roster was re-verified against it the same day), so the block
        # is the runner's address, not the county withdrawing the page. Any rung
        # succeeding resumes automation with no further change.
        continue-on-error: true
        run: python3 scripts/dekalb_county_board_scraper.py /tmp/dekalb_county_board_raw.json --engine auto

      - name: Report blocked source on the standing issue
        if: steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="DeKalb County Board roster: automated refresh blocked from CI runners"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "The weekly roster scrape failed on every engine (direct requests, headless Chromium, and the Internet Archive). dekalbcounty.org serves SiteGround's SG-Captcha, which scores the CALLER'S IP (\`y=ipr:<address>\` in its own redirect) rather than sampling requests — so this is specific to GitHub Actions runner addresses. The page answers a well-reputed client normally, which is how the shipped data/app/dekalb-county-board-members.json was verified current on 2026-08-02. That file keeps its last verified state and stays correct until the county changes members. Manual step when this issue is old or an election/appointment happened: re-run the scraper from a non-runner host and refresh via scripts/build_dekalb_county_board_roster.py. This issue is updated by each failed weekly run; close it if the block lifts and a run goes green. Latest failed run: $run_url"
          else
            gh issue comment "$num" --body "Still blocked as of $(date -u +%F) — $run_url"
          fi

      - name: Rebuild roster data file
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/build_dekalb_county_board_roster.py /tmp/dekalb_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/validate_index.py index.html

      - name: Check for changes
        id: diff
        if: steps.scrape.outcome == 'success'
        run: |
          if git diff --quiet -- data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.scrape.outcome == 'success' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/dekalb-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/app/dekalb-county-board-members.json
          git commit -m "Update DeKalb County Board roster from dekalbcounty.org"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update DeKalb County Board roster from dekalbcounty.org" \
              --body "Automated weekly refresh of the DeKalb County Board District card's member roster (district, name, party, phone, published email, Board Chair role), generated by \`scripts/dekalb_county_board_scraper.py\` + \`scripts/build_dekalb_county_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. Two members publish no phone; that is the source, not a scrape failure. The Board Chair role is applied only on an unambiguous single name match against the county's chairperson table, so a chair row that disappears means the match stopped resolving and is worth checking." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
