name: Update IA Des Moines council roster

# Weekly refresh of all seven seats the City of Des Moines elects
# (ia/data/app/dsm-council-members.json, read by ia/index.html's Des Moines
# City Council Ward card). Iowa Code 372.4(1)(b) seats a mayor, two at-large
# council members and one member from each of four wards, so this file carries
# the three citywide seats as well as the four keyed to wards -- a ward layer
# alone would answer four sevenths of the question.
#
# TWO THINGS THIS RUN RE-VERIFIES BESIDES THE ROSTER, both inside
# build_dsm_wards.py --check, which never writes:
#
#   * THE TILING GATE. The four wards must still cover the city's own City
#     Boundary layer. An annexation the ward layer has not caught up with
#     would leave a Des Moines reader in a hole where this layer answers
#     nothing at all, and no roster check would notice.
#   * THE CITY'S TERMS. data.dsm.city's Terms of Use carry a Right to
#     Discontinue Feeds clause, so this weekly fetch is also how a withdrawn
#     service gets noticed rather than discovered months later.
#
# Only the roster scrape below can produce a diff for this workflow to PR.

on:
  schedule:
    - cron: "30 17 * * 4" # Thursday 17:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests

      - name: Re-verify the ward geometry, its tiling of the city, and the city's terms
        run: python3 ia/scripts/build_dsm_wards.py --check

      - name: Scrape the city's own council page
        run: python3 ia/scripts/dsm_council_scraper.py

      - name: Rebuild the council roster (cross-witnessed against the Wards layer)
        run: python3 ia/scripts/build_dsm_council.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/dsm-council-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ia-dsm-council-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add ia/data/app/dsm-council-members.json
          git commit -m "Update Des Moines city council roster from dsm.city"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Des Moines city council roster from dsm.city" \
              --body "Automated weekly refresh of the Des Moines City Council Ward card's roster, generated by \`ia/scripts/build_dsm_council.py\` from the city's own council page (\`dsm_council_scraper.py\`) and cross-witnessed against the city's Wards feature service. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
