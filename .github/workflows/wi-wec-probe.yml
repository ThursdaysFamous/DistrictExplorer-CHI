name: WI — WEC reachability probe (one-shot)

# NOT a scheduled workflow and deliberately absent from wi/metro-worksheet.json's
# workflows[] list: this is phase 4 PR 5's one-shot MEASUREMENT (docs/
# WI_PHASE4_PLAN.md), dispatched manually, expected to run a handful of times
# ever. elections.wi.gov / myvote.wi.gov sit behind a Cloudflare managed (JS)
# challenge, measured 2026-08-25 from the development sandbox — and the one
# untried route is the CPD precedent: a REAL headless Chromium executing the
# challenge from a GitHub runner (the sandbox's browser has no egress, so from
# there the route is unavailable rather than untried). Whatever this run
# measures — cleared or refused — lands in docs/DATA_LAYER_GUIDEBOOK.md's gap
# blockers by a follow-up PR; the run itself writes nothing to the repo.
#
# The probe script is the contract: no CAPTCHA-solving, no evasion, no
# fingerprint-spoofing — a genuine browser given a bounded window
# (WEC_CHALLENGE_WAIT_S, default 120s) to let a managed challenge clear, and
# a challenge still on screen after that window is recorded as a refusal.
# A red run means the PROBE failed to run, never that WEC refused — refusal
# is a successful measurement and exits 0.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # Four targets, at most two 120s challenge windows plus five bulk-link
    # re-fetches; bounded so a hung fetch dies visibly.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install probe dependencies
        run: pip install -c wi/scripts/requirements.txt requests playwright

      - name: Install Chromium for Playwright
        run: python3 -m playwright install --with-deps chromium

      - name: Probe WEC + secondary targets
        run: python3 wi/scripts/wi_wec_probe.py --out wec-probe-results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wec-probe-results
          path: wec-probe-results.json
          if-no-files-found: warn
