name: Validate layer sources

# Monthly freshness check for the data sources index.html depends on.
# Unlike the roster workflows (which re-scrape the same page), this catches the
# other failure mode: a publisher silently superseding a dataset with a newer
# one — Chicago Data Portal (Socrata) datasets are re-published under a NEW id
# every year, so a hardcoded id keeps serving last year's data with no error.
#
# It also runs scripts/validate_card_links.py, which checks the other surface a
# publisher can break silently: the ~1,100 URLs the cards and rosters actually
# render. Those have no scraper watching them at all.
#
# Neither script ever edits the app (swapping a dataset id is a schema-sensitive
# judgement call; replacing a dead link means finding where the page moved to).
# When either finds drift it exits with a WARN/FAIL status; this workflow then
# opens — or updates in place — a single tracking issue so a human reviews it.
# The job itself stays green: the issue is the signal, matching the roster
# pattern of "officeholder/source changes get a human look before they ship."

on:
  schedule:
    - cron: "0 14 1 * *" # 1st of the month, 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        # requests for every check; shapely only for the LaSalle derived-board
        # check (geometric union of the county's precinct fabric). Both pinned
        # via scripts/requirements.txt.
        run: pip install -c scripts/requirements.txt requests shapely

      # Livingston's board districts are DERIVED — TIGER townships dissolved per
      # the county's published composition — so their failure mode is this
      # workflow's, not the roster crons': a township rename or a reapportionment
      # makes the shipped file disagree with the Census without anything
      # erroring. Checked here rather than in the per-PR merge gate because it
      # needs TIGERweb, and a network call on every pull request is a flake
      # waiting to happen. continue-on-error for the same reason as below: a
      # human should look, not a red build.
      - name: Livingston derived board districts still match TIGER
        continue-on-error: true
        run: python3 scripts/build_livingston_board_districts.py --check

      # Ogle's are derived the same way but from PRECINCTS (Census 2020 voting
      # districts) per resolution R-2021-1106, so this check also re-runs the
      # whole-township corroboration: 23 of the county's 24 townships must still
      # be exactly reconstructed by their precincts in both census layers. Only
      # Flagg is split (districts 3/4), and that assertion is part of the check —
      # a re-precincting that split a second township would fail here rather than
      # ship a line the county never drew.
      - name: Ogle derived board districts still match the adopted composition
        continue-on-error: true
        run: python3 scripts/build_ogle_board_districts.py --check

      # Carroll's are the simplest derived set in the fleet — three districts
      # made of whole townships — but they carry the same failure mode: a
      # township rename or a merge makes the shipped file disagree with the
      # Census without anything erroring. The build also asserts that all 12
      # TIGER townships are claimed exactly once, which is what would catch a
      # reapportionment.
      - name: Carroll derived board districts still match TIGER
        continue-on-error: true
        run: python3 scripts/build_carroll_board_districts.py --check

      # LaSalle's are derived from the COUNTY'S OWN precinct service per its
      # election canvasses (the county's published board GIS is the superseded
      # 2011-2021 map). This check's failure mode is a re-precincting: the
      # build asserts the 119 precinct names, the county population total, and
      # nine districts' populations against the adopted map's printed values,
      # so a changed fabric fails here — the cue to re-derive the canvass
      # tables — rather than silently shipping stale lines.
      - name: LaSalle derived board districts still match the county fabric
        continue-on-error: true
        run: python3 scripts/build_lasalle_board_districts.py --check

      - name: Validate layer sources
        id: validate
        # continue-on-error: a FAIL exit (1) must not red the job — per the
        # project's "surface for a human, don't block" convention, the tracking
        # issue below is the signal. status.txt carries ok|warn|fail.
        continue-on-error: true
        run: |
          python3 scripts/validate_sources.py \
            --report source-report.md \
            --status-file status.txt
          echo "status=$(cat status.txt)" >> "$GITHUB_OUTPUT"

      # The OTHER half of every result card: the link a reader clicks, and each
      # roster's sourceUrl. validate_sources.py watches the DATA endpoints and
      # says nothing about these, so Macon's card shipped a hostname with no DNS
      # record for three days — nothing looked. Same posture as every check
      # above: report, never edit, and fold the result into the one issue below.
      - name: Validate card + roster links
        id: cardlinks
        continue-on-error: true
        run: |
          python3 scripts/validate_card_links.py \
            --report card-link-report.md \
            --status-file card-status.txt
          echo "status=$(cat card-status.txt)" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.validate.outputs.status != 'ok' || steps.cardlinks.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Title unchanged even though the issue now carries link findings too:
          # it is matched by title to update in place, so renaming it would
          # orphan the open issue and start a duplicate.
          title="Layer source drift detected — review needed"
          # Prepend a short header so the issue explains itself, then the reports.
          # Each is included only if its step got far enough to write one — a
          # crashed checker must not take out the other's findings.
          {
            echo "_Automated by \`.github/workflows/validate-sources.yml\` on $(date -u +%Y-%m-%d). Nothing was changed in the app — review each item, then update \`index.html\` (dataset ids, card links) or re-download the boundary shapefile as needed. Close this issue once addressed; it will reopen/refresh on the next run if drift remains._"
            echo
            if [ -f source-report.md ]; then cat source-report.md; else
              echo "> \`validate_sources.py\` produced no report this run — check the job log."; fi
            echo
            if [ -f card-link-report.md ]; then cat card-link-report.md; else
              echo "> \`validate_card_links.py\` produced no report this run — check the job log."; fi
          } > issue-body.md

          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" --body "Refreshed by the monthly source-validation run — see the updated issue body for the current status."
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
            echo "Opened a new tracking issue."
          fi
