<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chicago District Explorer — moved to /il/</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://chidistricts.com/il/" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #F4F7F9; color: #14181C; text-align: center; padding: 24px;
  }
  a { color: #0B5394; }
  @media (prefers-color-scheme: dark) { body { background: #14181C; color: #F4F7F9; } a { color: #7FB3E8; } }
</style>
<script>
/* The Illinois app moved from this origin's root to /il/ so the root can become
   the fleet landing page. GitHub Pages cannot serve a 301, so this stub is the
   redirect — which is why it must be exhaustive about what it carries forward.

   PRESERVE QUERY *AND* HASH, query first. The hash is the permalink
   (#point=lat,lng&layers=...) and the query carries the share/embed tagging
   (?utm_source=embed&utm_medium=iframe) that every copied embed snippet built
   from the old root URL still sends here. Dropping either would turn a shared
   link into a bare map.

   The two service-worker lines are narrow on purpose:
     * unregister ONLY the registration whose scope is this origin's root. An
       unfiltered getRegistrations().forEach(unregister) would also kill the
       /il/ app's own worker on every root visit, permanently breaking its
       offline mode.
     * delete ONLY the exact legacy cache name. CacheStorage is per-ORIGIN, not
       per-scope, so a prefix sweep here would wipe the /il/ instance's precache
       (~30 MB of boundary geometry) out from under it.
   Both are belt-and-braces: /sw.js is itself now a kill switch that unregisters
   on activate. Neither this page nor that worker re-registers anything. */
(function () {
  var target = "/il/" + location.search + location.hash;
  try {
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) {
          if (r.scope === location.origin + "/") { r.unregister(); }
        });
      })["catch"](function () {});
    }
    if (window.caches && caches.delete) { caches.delete("district-explorer-shell-v51"); }
  } catch (e) { /* a redirect must never be blocked by cleanup */ }
  location.replace(target);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/il/"></noscript>
</head>
<body>
  <p>The Chicago District Explorer now lives at <a href="/il/">chidistricts.com/il/</a>.</p>
</body>
</html>
